<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E2A47'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<meta name="description" content="Crie uma nova senha para a sua conta do SOS Virtual.">
<meta name="referrer" content="no-referrer">
<title>Nova senha — SOS Virtual</title>
<style>
body{display:grid;place-items:center;min-height:100vh;padding:1.5rem}
.caixa{width:100%;max-width:420px}
.caixa .logo{display:block;color:var(--brand);margin:0 0 1.5rem}.caixa .logo i{color:var(--brand2)}
.caixa form,.caixa .cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2rem}
.caixa h1{font-size:1.7rem;margin-bottom:.3rem}
.caixa p.sub{color:var(--ink2);margin-bottom:1.5rem}
.caixa .btn{width:100%}
.caixa .troca{text-align:center;margin-top:1.1rem;color:var(--ink2);font-size:.92rem}
.esqueci{display:inline-block;margin-top:.45rem;font-size:.88rem}
</style>
</head>
<body>
<div class="caixa">
  <a class="logo" href="index.html">SOS<i>Virtual</i></a>
  <form id="form">
    <h1>Criar nova senha</h1>
    <p class="sub">Escolha uma senha com pelo menos 8 caracteres.</p>
    <div id="msg" class="aviso erro" hidden role="alert"></div>
    <div class="campo"><label for="senha">Nova senha</label><input type="password" id="senha" autocomplete="new-password" required><div class="forca"><i id="forca"></i></div></div>
    <div class="campo"><label for="senha2">Confirmar nova senha</label><input type="password" id="senha2" autocomplete="new-password" required></div>
    <button class="btn" type="submit">Salvar nova senha</button>
    <p class="troca"><a href="login.html">Voltar para o login</a></p>
  </form>
  <div id="invalido" class="cartao" hidden>
    <h1>Link inválido</h1>
    <p class="sub">Esse link de redefinição não é válido ou já expirou. Peça um novo para continuar.</p>
    <a class="btn" href="recuperar.html" style="text-align:center">Pedir novo link</a>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/senha-visivel.js"></script>
<script>
// o token vem no "#" do link do e-mail (não é enviado ao servidor); depois de lido some da barra de endereço
const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
history.replaceState(null, '', location.pathname);
if (!token) { document.getElementById('form').hidden = true; document.getElementById('invalido').hidden = false; }

const btn = document.querySelector('#form button[type=submit]');
senha.addEventListener('input', () => {
  const s = senha.value; let p = 0;
  if (s.length >= 8) p++; if (s.length >= 12) p++;
  if (/[A-Z]/.test(s) && /[a-z]/.test(s)) p++;
  if (/\d/.test(s) && /[^A-Za-z0-9]/.test(s)) p++;
  forca.style.width = p * 25 + '%';
  forca.style.background = p < 2 ? 'var(--neg)' : p < 3 ? 'var(--gold)' : 'var(--pos)';
});
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  aviso('msg');
  if (senha.value.length < 8) return aviso('msg', 'A senha precisa ter pelo menos 8 caracteres.', 'erro');
  if (senha.value !== senha2.value) return aviso('msg', 'As senhas não são iguais.', 'erro');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    await api('/auth/redefinir-senha', { method: 'POST', body: JSON.stringify({ token, nova_senha: senha.value }) });
    // encerra qualquer sessão antiga deste navegador e leva ao login
    localStorage.removeItem('sosv_token'); localStorage.removeItem('sosv_usuario');
    location.href = 'login.html?senha=alterada';
  } catch (err) {
    if (/link inválido/i.test(err.message)) { document.getElementById('form').hidden = true; document.getElementById('invalido').hidden = false; return; }
    aviso('msg', msgErro(err), 'erro');
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
  }
});
</script>
</body>
</html>
