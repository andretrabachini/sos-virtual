<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Assistente — SOS Virtual</title></head>
<body data-pagina="assistente">
<div class="app"><aside id="menu"></aside>
<main class="conteudo">
  <header><h1>Assistente</h1><p>Converse sobre suas finanças ou registre um gasto escrevendo, por exemplo, "gastei R$ 50 no mercado".</p></header>
  <section class="painel chat">
    <div class="msgs" id="msgs" aria-live="polite"><div class="msg ia">Olá! Como posso ajudar com suas finanças hoje?</div></div>
    <div class="sugestoes" id="sug"><button type="button">Como estão meus gastos este mês?</button><button type="button">Me dê dicas para economizar</button><button type="button">Gastei R$ 50 no mercado hoje</button><button type="button">Como montar uma reserva de emergência?</button></div>
    <form class="entrada" id="form"><label for="txt" class="rot" style="position:absolute;left:-9999px">Mensagem</label><textarea id="txt" rows="1" placeholder="Digite sua mensagem..." required></textarea><button class="btn" id="env" type="submit">Enviar</button></form>
  </section>
</main></div>
<script src="js/app.js"></script>
<script>
let hist=[],ocupado=false;
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
async function enviar(texto){
  texto=texto.trim();if(!texto||ocupado)return;
  ocupado=true;env.disabled=true;txt.value='';sug.hidden=true;
  add(texto,'eu');hist.push({role:'user',content:texto});
  const esp=add('Digitando…','ia');
  try{
    const d=await api('/chat',{method:'POST',body:JSON.stringify({mensagem:texto,historico:hist.slice(-10)})});
    esp.textContent=d.resposta||'Não entendi, pode repetir?';hist.push({role:'assistant',content:esp.textContent});
  }catch(e){esp.textContent=e instanceof TypeError?msgErro(e):/404|Not Found/i.test(e.message)?'O assistente ainda não está disponível no servidor (a rota /api/chat não existe).':e.message;hist.pop();}
  ocupado=false;env.disabled=false;txt.focus();
}
form.addEventListener('submit',e=>{e.preventDefault();enviar(txt.value);});
txt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar(txt.value);}});
sug.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')enviar(e.target.textContent);});
</script></body></html>
