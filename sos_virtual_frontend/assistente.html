<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Assistente — SOS Virtual</title></head>
<body data-pagina="assistente">
<div class="app"><aside id="menu"></aside>
<main class="conteudo">
  <header><h1>Assistente</h1><p>Pergunte sobre seus gastos, peça dicas ou registre uma movimentação escrevendo naturalmente.</p></header>
  <section class="painel chat">
    <div class="msgs" id="msgs"><div class="msg ia">Olá! Posso ajudar com seus gastos e metas. Tente: "gastei R$ 50 no mercado hoje".</div></div>
    <div class="sugestoes" id="sug">
      <button>Como estão meus gastos este mês?</button><button>Me dê dicas para economizar</button><button>Como montar uma reserva de emergência?</button>
    </div>
    <div class="entrada"><textarea id="texto" rows="1" placeholder="Digite sua mensagem" aria-label="Mensagem"></textarea><button class="btn" id="enviar">Enviar</button></div>
  </section>
</main></div>
<script src="js/app.js"></script>
<script>
const historico=[];
function add(txt,tipo){const d=document.createElement('div');d.className='msg '+tipo;d.textContent=txt;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
async function enviarMsg(){
  const t=texto.value.trim();if(!t)return;
  texto.value='';sug.hidden=true;enviar.disabled=true;
  add(t,'eu');historico.push({role:'user',content:t});
  const esp=add('Pensando…','ia');
  try{
    const d=await api('/chat',{method:'POST',body:JSON.stringify({mensagem:t,historico})});
    esp.textContent=d.resposta||'Não entendi. Pode repetir de outro jeito?';historico.push({role:'assistant',content:esp.textContent});
  }catch(e){esp.textContent=msgErro(e);}
  enviar.disabled=false;texto.focus();
}
enviar.addEventListener('click',enviarMsg);
texto.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarMsg();}});
sug.addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){texto.value=e.target.textContent;enviarMsg();}});
</script></body></html>
