<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas — SOS Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e17; --surface: #111827; --card: #161d2e;
      --border: #1e2d45; --accent: #00d4a0; --accent2: #0099ff;
      --text: #e8edf5; --muted: #7a8aa0;
      --font-h: 'Syne', sans-serif; --font-b: 'DM Sans', sans-serif; --radius: 14px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-b); min-height: 100vh; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 2rem 1.25rem; position: fixed; top: 0; left: 0; bottom: 0; }
    .logo { font-family: var(--font-h); font-size: 1.3rem; font-weight: 800; color: var(--text); margin-bottom: 2.5rem; padding: 0 0.5rem; }
    .logo span { color: var(--accent); }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.75rem; border-radius: 10px; color: var(--muted); font-size: 0.9rem; font-weight: 500; text-decoration: none; transition: background 0.15s, color 0.15s; margin-bottom: 0.2rem; }
    .nav-item:hover, .nav-item.active { background: rgba(0,212,160,0.1); color: var(--accent); }
    .nav-item svg { flex-shrink: 0; }
    .sidebar-footer { margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .user-info { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .avatar { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-h); font-weight: 800; font-size: 0.9rem; color: var(--bg); flex-shrink: 0; }
    .user-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.75rem; color: var(--muted); }
    .main { margin-left: 240px; flex: 1; padding: 2.5rem; }
    .topbar { display: flex; align-items: center; margin-bottom: 2rem; }
    .topbar h1 { font-family: var(--font-h); font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
    .topbar h1 span { color: var(--accent); }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 1.5rem; }
    .section-title { font-family: var(--font-h); font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .form-group input, .form-group select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 0.65rem 0.9rem; font-size: 0.9rem; font-family: var(--font-b); outline: none; transition: border-color 0.15s; }
    .form-group input:focus { border-color: var(--accent); }
    .form-group.full { grid-column: 1 / -1; }
    .btn { padding: 0.7rem 1.5rem; border-radius: 8px; border: none; font-family: var(--font-b); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.82rem; }
    .btn-danger { background: transparent; border: 1px solid #ff5c7a; color: #ff5c7a; }
    .alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; }
    .alert-success { background: rgba(0,212,160,0.1); color: var(--accent); border: 1px solid rgba(0,212,160,0.3); }
    .alert-error { background: rgba(255,92,122,0.1); color: #ff5c7a; border: 1px solid rgba(255,92,122,0.3); }
    .metas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    .meta-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .meta-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .meta-nome { font-family: var(--font-h); font-size: 1rem; font-weight: 700; }
    .meta-prazo { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
    .meta-valores { display: flex; justify-content: space-between; margin-bottom: 0.6rem; font-size: 0.85rem; }
    .meta-atual { color: var(--accent); font-weight: 600; }
    .meta-alvo { color: var(--muted); }
    .progress-bar { background: var(--border); border-radius: 99px; height: 8px; overflow: hidden; margin-bottom: 1rem; }
    .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.4s; }
    .meta-pct { font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; }
    .meta-actions { display: flex; gap: 0.5rem; align-items: center; }
    .depositar-form { display: flex; gap: 0.5rem; flex: 1; }
    .depositar-form input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.4rem 0.7rem; font-size: 0.82rem; font-family: var(--font-b); outline: none; width: 100%; }
    .empty { text-align: center; color: var(--muted); padding: 3rem 0; font-size: 0.9rem; }
    @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 1.5rem; } .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">SOS<span>Virtual</span></div>
    <a href="dashboard.html" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="transacoes.html" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Transações
    </a>
    <a href="metas.html" class="nav-item active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Metas
    </a>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar">U</div>
        <div>
          <div class="user-name">Usuário</div>
          <div class="user-role">Conta pessoal</div>
        </div>
      </div>
      <a href="index.html" class="nav-item" style="color:#ff5c7a;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><h1><span>Metas</span> financeiras</h1></div>

    <div class="section">
      <div class="section-title">Nova meta</div>
      <form method="POST">
        <input type="hidden" name="acao" value="criar">
        <div class="form-grid">
          <div class="form-group full">
            <label>Descrição da meta</label>
            <input type="text" name="descricao" placeholder="Ex: Viagem, Reserva de emergência..." required>
          </div>
          <div class="form-group">
            <label>Valor alvo (R$)</label>
            <input type="number" name="valor_alvo" step="0.01" min="1" placeholder="0,00" required>
          </div>
          <div class="form-group">
            <label>Prazo</label>
            <input type="date" name="prazo" required>
          </div>
          <div class="form-group" style="justify-content:flex-end; align-items:flex-end; grid-column: 1/-1;">
            <button type="submit" class="btn btn-primary">Criar meta</button>
          </div>
        </div>
      </form>
    </div>

    <div class="section">
      <div class="section-title">Suas metas</div>
      <div class="metas-grid">
        <div class="meta-card">
          <div class="meta-header">
            <div>
              <div class="meta-nome">Viagem para a praia</div>
              <div class="meta-prazo">Prazo: 20/12/2026</div>
            </div>
          </div>
          <div class="meta-valores">
            <span class="meta-atual">R$ 900,00</span>
            <span class="meta-alvo">de R$ 3.000,00</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:30%"></div>
          </div>
          <div class="meta-pct">30% concluído</div>
          <div class="meta-actions">
            <form method="POST" class="depositar-form">
              <input type="hidden" name="acao" value="depositar">
              <input type="hidden" name="meta_id" value="1">
              <input type="number" name="valor_deposito" step="0.01" min="0.01" placeholder="R$ depositar">
              <button type="submit" class="btn btn-primary btn-sm">+</button>
            </form>
            <a href="#" class="btn btn-danger btn-sm" onclick="return confirm('Deletar esta meta?')">Deletar</a>
          </div>
        </div>
        <div class="meta-card">
          <div class="meta-header">
            <div>
              <div class="meta-nome">Reserva de emergência</div>
              <div class="meta-prazo">Prazo: 01/06/2027</div>
            </div>
            <span style="color:var(--accent); font-size:1.3rem;">✓</span>
          </div>
          <div class="meta-valores">
            <span class="meta-atual">R$ 5.000,00</span>
            <span class="meta-alvo">de R$ 5.000,00</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:100%"></div>
          </div>
          <div class="meta-pct">100% concluído</div>
          <div class="meta-actions">
            <a href="#" class="btn btn-danger btn-sm" onclick="return confirm('Deletar esta meta?')">Deletar</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
