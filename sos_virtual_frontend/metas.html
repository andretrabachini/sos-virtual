<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SOS Virtual: suas finanças pessoais em um só lugar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E2A47'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Metas — SOS Virtual</title></head>
<body data-pagina="metas">
<div class="app"><aside id="menu"></aside>
<main class="conteudo">
  <header><h1>Metas</h1><p>Defina um valor e acompanhe quanto já guardou.</p></header>
  <div id="msg" class="aviso erro" hidden role="alert"></div>
  <section class="painel"><h2>Nova meta</h2>
    <form id="form" class="form-grid">
      <div class="campo larga"><label for="titulo">Nome da meta</label><input id="titulo" placeholder="Ex.: viagem, reserva de emergência" required></div>
      <div class="campo"><label for="alvo">Valor alvo (R$)</label><input type="number" id="alvo" step="0.01" min="1" required></div>
      <div class="campo"><label for="prazo">Prazo (opcional)</label><input type="date" id="prazo"></div>
      <div class="campo"><button class="btn" type="submit" style="width:100%">Criar meta</button></div>
    </form>
  </section>
  <section><div class="cartoes" id="lista"></div></section>
</main></div>
<script src="js/app.js"></script>
<script>
async function carregar(){try{
  aviso('msg');
  const m=await api('/metas');
  lista.innerHTML=m.length?m.map(x=>{const ok=x.progresso>=100;return '<div class="painel"><div class="linha"><h3>'+esc(x.titulo)+'</h3><b class="'+(ok?'pos':'rot')+'">'+(ok?'Concluída':x.progresso+'%')+'</b></div>'+
    '<div class="rot">'+(x.prazo?'Prazo: '+new Date(x.prazo).toLocaleDateString('pt-BR'):'Sem prazo')+'</div>'+
    '<div class="linha" style="margin-top:.8rem"><b>'+brl(x.valor_atual)+'</b><span class="rot">de '+brl(x.valor_alvo)+'</span></div>'+
    '<div class="barra meta" role="progressbar" aria-valuenow="'+x.progresso+'" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso de '+esc(x.titulo)+'"><i style="width:'+Math.min(x.progresso,100)+'%"></i></div>'+
    '<div class="acoes-linha">'+(ok?'':'<input type="number" step="0.01" min="0.01" placeholder="Valor a depositar" aria-label="Valor a depositar em '+esc(x.titulo)+'" id="d'+x.id+'"><button class="btn peq" data-dep="'+x.id+'">Depositar</button>')+'<button class="btn perigo peq" data-del="'+x.id+'">Excluir</button></div></div>';}).join(''):'<p class="vazio">Nenhuma meta ainda. Crie a primeira acima.</p>';
}catch(e){aviso('msg',msgErro(e),'erro');}}
form.addEventListener('submit',async e=>{e.preventDefault();
  try{await api('/metas',{method:'POST',body:JSON.stringify({titulo:titulo.value.trim(),valor_alvo:parseFloat(alvo.value),prazo:prazo.value||null})});form.reset();carregar();}
  catch(err){aviso('msg',msgErro(err),'erro');}});
lista.addEventListener('click',async e=>{const t=e.target.dataset;
  try{
    if(t.dep){const v=parseFloat(document.getElementById('d'+t.dep).value);if(!(v>0))return aviso('msg','Informe um valor maior que zero.','erro');
      await api('/metas/'+t.dep+'/depositar',{method:'POST',body:JSON.stringify({valor:v})});carregar();}
    else if(t.del&&confirm('Excluir esta meta?')){await api('/metas/'+t.del,{method:'DELETE'});carregar();}
  }catch(err){aviso('msg',msgErro(err),'erro');}});
carregar();
</script></body></html>
