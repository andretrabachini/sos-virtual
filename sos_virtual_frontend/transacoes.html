<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Transações — SOS Virtual</title></head>
<body data-pagina="transacoes">
<div class="app"><aside id="menu"></aside>
<main class="conteudo">
  <header><h1>Transações</h1><p>Registre o que entra e o que sai. Sem categoria, o sistema tenta descobrir pela descrição.</p></header>
  <div id="msg" class="aviso erro" hidden role="alert"></div>
  <section class="grid">
    <div class="painel"><div class="rot">Receitas</div><div class="num pos" id="rec">–</div></div>
    <div class="painel"><div class="rot">Despesas</div><div class="num neg" id="des">–</div></div>
    <div class="painel"><div class="rot">Saldo</div><div class="num" id="sal">–</div></div>
  </section>
  <section class="painel"><h2>Nova transação</h2>
    <form id="form" class="form-grid">
      <div class="campo larga"><label for="descricao">Descrição</label><input id="descricao" placeholder="Ex.: Mercado, Salário, Netflix" required></div>
      <div class="campo"><label for="valor">Valor (R$)</label><input type="number" id="valor" step="0.01" min="0.01" required></div>
      <div class="campo"><label for="tipo">Tipo</label><select id="tipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></div>
      <div class="campo"><label for="categoria">Categoria</label><select id="categoria"><option value="">Detectar automaticamente</option></select></div>
      <div class="campo"><button class="btn" type="submit" style="width:100%">Registrar</button></div>
    </form>
  </section>
  <section class="painel">
    <div class="filtro"><h2>Histórico</h2><input type="month" id="mes" aria-label="Mês"></div>
    <table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody id="lista"></tbody></table>
  </section>
</main></div>
<script src="js/app.js"></script>
<script>
const CATS=['Alimentação','Transporte','Saúde','Educação','Lazer','Moradia','Vestuário','Investimentos','Outros'];
categoria.innerHTML+=CATS.map(c=>'<option>'+c+'</option>').join('');
mes.value=new Date().toISOString().slice(0,7);
async function carregar(){
  try{
    aviso('msg');
    const t=await api('/transacoes?mes='+mes.value);
    const r=t.filter(x=>x.valor>0).reduce((a,x)=>a+x.valor,0),d=t.filter(x=>x.valor<0).reduce((a,x)=>a-x.valor,0);
    rec.textContent=brl(r);des.textContent=brl(d);sal.textContent=brl(r-d);sal.className='num '+(r-d>=0?'pos':'neg');
    lista.innerHTML=t.length?t.map(x=>'<tr><td>'+new Date(x.data).toLocaleDateString('pt-BR')+'</td><td>'+esc(x.descricao)+'</td><td>'+esc(x.categoria)+'</td><td style="text-align:right" class="'+(x.valor>0?'pos':'neg')+'">'+brl(x.valor)+'</td><td style="text-align:right"><button class="btn perigo peq" data-id="'+x.id+'">Excluir</button></td></tr>').join(''):'<tr><td colspan="5" class="vazio">Nenhuma transação neste mês. Registre a primeira acima.</td></tr>';
  }catch(e){aviso('msg',msgErro(e),'erro');}
}
mes.addEventListener('change',carregar);
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const v=parseFloat(valor.value);
  try{
    await api('/transacoes',{method:'POST',body:JSON.stringify({descricao:descricao.value.trim(),valor:tipo.value==='despesa'?-v:v,categoria:categoria.value})});
    form.reset();carregar();
  }catch(err){aviso('msg',msgErro(err),'erro');}
});
lista.addEventListener('click',async e=>{
  const id=e.target.dataset.id;if(!id||!confirm('Excluir esta transação?'))return;
  try{await api('/transacoes/'+id,{method:'DELETE'});carregar();}catch(err){aviso('msg',msgErro(err),'erro');}
});
carregar();
</script></body></html>
