<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SOS Virtual: suas finanças pessoais em um só lugar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E2A47'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Otimizador — SOS Virtual</title></head>
<body data-pagina="otimizador">
<div class="app"><aside id="menu"></aside>
<main class="conteudo">
  <header><h1>Otimizador de pagamentos</h1><p>Cadastre suas contas e cartões, com limite e cashback, e veja de qual delas vale mais a pena pagar cada despesa.</p></header>
  <div id="msg" class="aviso erro" hidden role="alert"></div>

  <section class="painel"><h2>Minhas contas e cartões</h2>
    <form id="formconta" class="form-grid">
      <div class="campo larga"><label for="cnome">Nome</label><input id="cnome" maxlength="100" placeholder="Ex.: Cartão Nubank, Conta Corrente" required></div>
      <div class="campo"><label for="ccap">Limite do mês (R$, opcional)</label><input type="number" id="ccap" step="0.01" min="0.01" placeholder="Sem limite informado"></div>
      <div class="campo"><label for="ctipo">Benefício ou custo</label><select id="ctipo"><option value="beneficio">Cashback / benefício</option><option value="custo">Juros / taxa</option></select></div>
      <div class="campo"><label for="cpct">Percentual (%)</label><input type="number" id="cpct" step="0.01" min="0" max="100" placeholder="0"></div>
      <div class="campo"><button class="btn" id="btnconta" type="submit" style="width:100%">Adicionar conta</button></div>
      <div class="campo" id="cancelarbox" hidden><button class="btn sec" id="cancelar" type="button" style="width:100%">Cancelar edição</button></div>
    </form>
  </section>
  <section style="margin-bottom:1.5rem"><div class="cartoes" id="listac"></div></section>

  <section class="painel"><h2>Despesas a pagar</h2>
    <p class="rot" style="margin-bottom:1rem">Começa com os gastos deste mês por categoria. Altere os valores para simular outros cenários.</p>
    <div class="form-grid" id="boxdesp"></div>
    <button class="btn" id="calc" type="button">Calcular melhor forma de pagar</button>
  </section>

  <section class="painel" id="resp" hidden><h2>Resultado</h2><div id="res-corpo"></div></section>
</main></div>
<script src="js/app.js"></script>
<script src="js/grafo_visualizador.js"></script>
<script>
const CATS=['Alimentação','Transporte','Saúde','Educação','Lazer','Moradia','Vestuário','Investimentos','Outros'];
let minhasContas=[],editando=null;
const pctTxt=v=>Math.abs(v).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
const efeitoTxt=v=>v>0?'<span class="pos">+'+brl(v)+'</span>':v<0?'<span class="neg">−'+brl(-v)+'</span>':'<span class="rot">—</span>';
const beneficio=c=>c.custo<0?'<b class="pos">Cashback de '+pctTxt(c.custo)+'</b>':c.custo>0?'<b class="neg">Juros/taxa de '+pctTxt(c.custo)+'</b>':'<span class="rot">Sem benefício ou custo</span>';

async function carregarContas(){
  minhasContas=await api('/contas');
  listac.innerHTML=minhasContas.length?minhasContas.map(c=>'<div class="painel"><div class="linha"><h3>'+esc(c.nome)+'</h3>'+beneficio(c)+'</div>'+
    '<div class="rot">'+(c.capacidade?'Limite do mês: '+brl(c.capacidade):'Sem limite informado')+'</div>'+
    '<div class="acoes-linha"><button class="btn sec peq" data-edit="'+c.id+'">Editar</button><button class="btn perigo peq" data-del="'+c.id+'">Excluir</button></div></div>').join('')
    :'<p class="vazio">Nenhuma conta ainda. Cadastre acima as contas e cartões que você usa.</p>';
}
async function carregarDespesas(){
  const g=(await api('/dashboard')).por_categoria||{};
  boxdesp.innerHTML=CATS.map((c,i)=>'<div class="campo"><label for="dsp'+i+'">'+c+'</label><input type="number" id="dsp'+i+'" data-cat="'+c+'" step="0.01" min="0" value="'+(g[c]||0)+'"></div>').join('');
}
function mostrar(r){
  const corpo=document.getElementById('res-corpo');resp.hidden=false;
  if(r.status!=='sucesso'){corpo.innerHTML='<div class="aviso" style="margin:0">'+esc(r.mensagem)+'</div>';return;}
  const b=r.beneficio_total;
  corpo.innerHTML='<div class="grid"><div class="painel"><div class="rot">Total a pagar</div><div class="num">'+brl(r.total_despesas)+'</div></div>'+
    '<div class="painel"><div class="rot">'+(b<0?'Custo líquido (juros e taxas)':'Benefício líquido (cashback)')+'</div><div class="num '+(b<0?'neg':'pos')+'">'+brl(Math.abs(b))+'</div></div></div>'+
    '<div id="grafo-svg"></div><h3 style="margin:1.4rem 0 .5rem">Como pagar</h3>'+
    '<table><thead><tr><th>Conta</th><th>Despesa</th><th>Valor</th><th>Efeito</th></tr></thead><tbody>'+
    r.plano.map(p=>'<tr><td>'+esc(p.conta)+'</td><td>'+esc(p.categoria)+'</td><td>'+brl(p.valor)+'</td><td>'+efeitoTxt(p.efeito)+'</td></tr>').join('')+'</tbody></table>'+
    '<p class="rot" style="margin-top:.8rem">Efeito: verde é cashback ganho; vermelho é juros ou taxa paga. O cálculo escolhe a combinação que mais economiza respeitando o limite de cada conta.</p>';
  desenharGrafo(document.getElementById('grafo-svg'),r);
}
async function calcular(){
  const d={};document.querySelectorAll('#boxdesp input').forEach(i=>{d[i.dataset.cat]=parseFloat(i.value)||0;});
  try{aviso('msg');mostrar(await api('/grafo/otimizar',{method:'POST',body:JSON.stringify({despesas:d})}));}
  catch(err){aviso('msg',msgErro(err),'erro');}
}
function limpar(){editando=null;formconta.reset();btnconta.textContent='Adicionar conta';cancelarbox.hidden=true;}

formconta.addEventListener('submit',async e=>{e.preventDefault();aviso('msg');
  const pct=parseFloat(cpct.value)||0;
  const corpo={nome:cnome.value.trim(),capacidade:ccap.value?parseFloat(ccap.value):null,custo:ctipo.value==='custo'?pct:-pct};
  try{
    if(editando)await api('/contas/'+editando,{method:'PUT',body:JSON.stringify(corpo)});
    else await api('/contas',{method:'POST',body:JSON.stringify(corpo)});
    limpar();await carregarContas();calcular();
  }catch(err){aviso('msg',msgErro(err),'erro');}});
cancelar.addEventListener('click',limpar);
listac.addEventListener('click',async e=>{const t=e.target.dataset;
  try{
    if(t.edit){const c=minhasContas.find(x=>String(x.id)===t.edit);if(!c)return;
      editando=c.id;cnome.value=c.nome;ccap.value=c.capacidade??'';ctipo.value=c.custo>0?'custo':'beneficio';cpct.value=Math.abs(c.custo)||'';
      btnconta.textContent='Salvar alterações';cancelarbox.hidden=false;cnome.focus();}
    else if(t.del&&confirm('Excluir esta conta? As parcelas futuras projetadas a partir dela também serão removidas.')){
      await api('/contas/'+t.del,{method:'DELETE'});if(String(editando)===t.del)limpar();await carregarContas();calcular();}
  }catch(err){aviso('msg',msgErro(err),'erro');}});
calc.addEventListener('click',calcular);
(async()=>{try{await Promise.all([carregarContas(),carregarDespesas()]);calcular();}catch(e){aviso('msg',msgErro(e),'erro');}})();
</script></body></html>
