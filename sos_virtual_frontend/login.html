<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — SOS Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:1.5rem}
.caixa{width:100%;max-width:420px}
.caixa .logo{display:block;color:var(--brand);margin:0 0 1.5rem}.caixa .logo i{color:var(--brand2)}
.caixa form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2rem}
.caixa h1{font-size:1.7rem;margin-bottom:.3rem}
.caixa p.sub{color:var(--ink2);margin-bottom:1.5rem}
.caixa .btn{width:100%}
.caixa .troca{text-align:center;margin-top:1.1rem;color:var(--ink2);font-size:.92rem}
</style>
</head>
<body>
<div class="caixa">
  <a class="logo" href="index.html">SOS<i>Virtual</i></a>
  <form id="form">
    <h1>Entrar na conta</h1>
    <p class="sub">Use o e-mail e a senha do seu cadastro.</p>
    <div id="msg" class="aviso erro" hidden role="alert"></div>
    <div class="campo"><label for="email">E-mail</label><input type="email" id="email" autocomplete="email" required></div>
    <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Entrar</button>
    <p class="troca">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </form>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.hidden = true;
  try {
    const d = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email: email.value.trim(), senha: senha.value })
    });
    localStorage.setItem('sosv_token', d.token);
    localStorage.setItem('sosv_usuario', JSON.stringify(d.usuario));
    location.href = 'dashboard.html';
  } catch (err) {
    msg.textContent = err instanceof TypeError
      ? 'Não consegui falar com o servidor. Confira se o backend está rodando em http://127.0.0.1:5000.'
      : err.message;
    msg.hidden = false;
  }
});
</script>
</body>
</html>
