<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — SOS Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="dashboard">
<div class="app">
  <aside id="menu"></aside>
  <main class="conteudo">
    <header>
      <h1 id="ola">Painel</h1>
      <p id="mes"></p>
    </header>
    <div id="aviso" class="aviso" hidden></div>

    <section class="grid" aria-label="Resumo do mês">
      <div class="painel"><div class="rot">Saldo do mês</div><div class="num" id="saldo">–</div></div>
      <div class="painel"><div class="rot">Receitas</div><div class="num pos" id="receita">–</div></div>
      <div class="painel"><div class="rot">Despesas</div><div class="num neg" id="despesa">–</div></div>
    </section>

    <div class="duas">
      <section class="painel"><h2>Gastos por categoria</h2><div id="categorias"></div></section>
      <section class="painel"><h2>Metas</h2><div id="metas"></div></section>
    </div>

    <section class="painel">
      <h2>Últimas transações</h2>
      <table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th style="text-align:right">Valor</th></tr></thead><tbody id="recentes"></tbody></table>
    </section>

    <section class="painel">
      <h2>Mapa do seu dinheiro</h2>
      <div id="grafo">O grafo de contas e despesas (Cytoscape.js) será desenhado aqui.</div>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
<script>
const EXEMPLO = {
  mes: '2026-09', receita_total: 4500, despesa_total: 3260, saldo: 1240,
  por_categoria: { 'Moradia': 1500, 'Alimentação': 820, 'Transporte': 540, 'Lazer': 400 },
  transacoes_recentes: [
    { descricao: 'Salário', categoria: 'Outros', valor: 4500, data: '2026-09-14' },
    { descricao: 'Mercado', categoria: 'Alimentação', valor: -320, data: '2026-09-13' },
    { descricao: 'Uber', categoria: 'Transporte', valor: -45, data: '2026-09-10' }
  ],
  metas: [
    { titulo: 'Viagem para a praia', progresso: 30, valor_atual: 900, valor_alvo: 3000 },
    { titulo: 'Reserva de emergência', progresso: 100, valor_atual: 5000, valor_alvo: 5000 }
  ]
};

function desenhar(d) {
  const u = usuarioAtual();
  document.getElementById('ola').textContent = 'Olá, ' + (u.nome ? u.nome.split(' ')[0] : 'bem-vindo');
  const [ano, m] = d.mes.split('-');
  document.getElementById('mes').textContent = new Date(ano, m - 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  saldo.textContent = brl(d.saldo);
  receita.textContent = brl(d.receita_total);
  despesa.textContent = brl(d.despesa_total);

  const cats = Object.entries(d.por_categoria).sort((a, b) => b[1] - a[1]);
  const maior = cats.length ? cats[0][1] : 1;
  categorias.innerHTML = cats.length
    ? cats.map(([n, v]) => `<div class="linha"><span>${esc(n)}</span><b>${brl(v)}</b></div><div class="barra"><i style="width:${v / maior * 100}%"></i></div>`).join('')
    : '<p class="rot">Nenhuma despesa neste mês. Registre a primeira em Transações.</p>';

  metas.innerHTML = d.metas.length
    ? d.metas.map(m => `<div class="linha"><span>${esc(m.titulo)}</span><b>${m.progresso}%</b></div><div class="barra meta"><i style="width:${Math.min(m.progresso, 100)}%"></i></div>`).join('')
    : '<p class="rot">Você ainda não tem metas. Crie uma em Metas.</p>';

  recentes.innerHTML = d.transacoes_recentes.length
    ? d.transacoes_recentes.map(t => `<tr><td>${new Date(t.data).toLocaleDateString('pt-BR')}</td><td>${esc(t.descricao)}</td><td>${esc(t.categoria)}</td><td style="text-align:right" class="${t.valor > 0 ? 'pos' : 'neg'}">${brl(t.valor)}</td></tr>`).join('')
    : '<tr><td colspan="4" class="rot">Nenhuma transação ainda.</td></tr>';
}

(async () => {
  try {
    desenhar(await api('/dashboard'));
  } catch (err) {
    const av = document.getElementById('aviso');
    av.innerHTML = 'Mostrando dados de exemplo: ' + (err instanceof TypeError
      ? 'o backend não respondeu em ' + esc(API) + '.'
      : esc(err.message) + '. <a href="login.html">Entrar novamente</a>.');
    av.hidden = false;
    desenhar(EXEMPLO);
  }
})();
</script>
</body>
</html>
