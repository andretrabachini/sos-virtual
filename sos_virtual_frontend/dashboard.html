<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SOS Virtual: suas finanças pessoais em um só lugar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E2A47'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Painel — SOS Virtual</title></head>
<body data-pagina="dashboard">
<div class="app"><aside id="menu"></aside>
<main class="conteudo">
  <header><h1 id="ola">Painel</h1><p id="mes">Resumo do mês</p></header>
  <div id="msg" class="aviso erro" hidden role="alert"></div>
  <section class="grid">
    <div class="painel"><div class="rot">Receitas</div><div class="num pos" id="rec">—</div></div>
    <div class="painel"><div class="rot">Despesas</div><div class="num neg" id="des">—</div></div>
    <div class="painel"><div class="rot">Saldo do mês</div><div class="num" id="sal">—</div></div>
    <div class="painel"><div class="rot">Metas em andamento</div><div class="num" id="met">—</div></div>
  </section>
  <div class="duas">
    <section class="painel"><h2>Gastos por categoria</h2><div id="cats"></div></section>
    <section class="painel"><h2>Para onde o dinheiro vai</h2><div id="grafo">Carregando…</div></section>
  </div>
  <section class="painel"><h2>Parcelas dos próximos meses</h2><div id="proj"><p class="vazio">Carregando…</p></div></section>
  <section class="painel"><div class="filtro"><h2>Últimas transações</h2><a href="transacoes.html">Ver todas</a></div>
    <table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr></thead><tbody id="tb"></tbody></table>
  </section>
</main></div>
<script src="js/app.js"></script>
<script src="js/grafo_visualizador.js"></script>
<script>
const u=usuarioAtual();ola.textContent='Olá, '+((u.nome||'').split(' ')[0]||'bem-vindo');
(async()=>{try{
  const d=await api('/dashboard');
  const [a,m]=d.mes.split('-');mes.textContent='Resumo de '+new Date(a,m-1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  rec.textContent=brl(d.receita_total);des.textContent=brl(d.despesa_total);
  sal.textContent=brl(d.saldo);sal.className='num '+(d.saldo<0?'neg':'pos');
  met.textContent=d.metas.filter(x=>x.progresso<100).length;
  const c=Object.entries(d.por_categoria).sort((x,y)=>y[1]-x[1]),max=c.length?c[0][1]:1;
  cats.innerHTML=c.length?c.map(([n,v])=>'<div class="linha"><span>'+esc(n)+'</span><b>'+brl(v)+'</b></div><div class="barra"><i style="width:'+v/max*100+'%"></i></div>').join(''):'<p class="vazio">Nenhum gasto neste mês ainda.</p>';
  tb.innerHTML=d.transacoes_recentes.length?d.transacoes_recentes.map(t=>'<tr><td>'+new Date(t.data).toLocaleDateString('pt-BR')+'</td><td>'+esc(t.descricao)+'</td><td>'+esc(t.categoria)+'</td><td class="'+(t.valor>0?'pos':'neg')+'">'+(t.valor>0?'+':'−')+brl(Math.abs(t.valor))+'</td></tr>').join(''):'<tr><td colspan="4" class="vazio">Nenhuma transação ainda.</td></tr>';
}catch(e){aviso('msg',msgErro(e),'erro');}})();

// mapa "para onde o dinheiro vai": a melhor forma de pagar as despesas do mês (grafo de fluxo de custo mínimo)
(async()=>{try{
  const g=await api('/grafo');
  if(g.nos){
    grafo.style.cssText='height:auto;border:0;display:block;padding:0';
    desenharGrafo(grafo,g);
    if(g.status==='gargalo')grafo.insertAdjacentHTML('beforeend','<p class="aviso" style="margin:.8rem 0 0">'+esc(g.mensagem)+' <a href="grafo.html">Ajustar contas</a></p>');
    else grafo.insertAdjacentHTML('beforeend','<p class="rot" style="margin-top:.6rem">'+(g.beneficio_total<0?'Custo estimado de juros e taxas: ':'Benefício estimado de cashback: ')+'<b>'+brl(Math.abs(g.beneficio_total))+'</b> · <a href="grafo.html">ver detalhes e simular</a></p>');
  }else grafo.innerHTML='<div>'+esc(g.mensagem)+'<br><a href="grafo.html">Cadastrar contas e cartões</a></div>';
}catch(e){grafo.textContent=msgErro(e);}})();

// projeção das parcelas futuras (vem das arestas criadas na importação de extratos)
(async()=>{try{
  const p=await api('/simulacoes/projecao?meses=6');
  const total=p.meses.reduce((s,x)=>s+x.comprometido,0);
  if(!total){proj.innerHTML='<p class="vazio">Nenhuma parcela futura registrada. Importe um extrato com compras parceladas em Transações.</p>';return;}
  const renda=p.renda_mensal,maior=Math.max(...p.meses.map(x=>x.comprometido));
  proj.innerHTML=p.meses.map(x=>{
    const [ano,mm]=x.mes.split('-'),nome=new Date(ano,mm-1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const pct=renda?Math.min(x.comprometido/renda*100,100):x.comprometido/maior*100;
    const neg=x.saldo_livre!==null&&x.saldo_livre<0;
    return '<div class="linha"><span>'+nome+'</span><span><b>'+brl(x.comprometido)+'</b>'+(x.saldo_livre!==null?' <span class="rot">· '+(neg?'faltam '+brl(-x.saldo_livre):'sobra '+brl(x.saldo_livre))+'</span>':'')+'</span></div><div class="barra'+(neg?' perigo':'')+'"><i style="width:'+pct+'%"></i></div>';
  }).join('')+(renda?'<p class="rot">A barra mostra quanto da sua renda mensal já está comprometido por parcelas.</p>':'<p class="rot">Informe sua renda mensal no cadastro para ver quanto sobra livre em cada mês.</p>');
}catch(e){proj.innerHTML='<p class="vazio">'+esc(msgErro(e))+'</p>';}})();
</script></body></html>
